# Throwaway databases for integration tests and local development.
# Ports are offset so they never collide with a locally installed server.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dataquery
      POSTGRES_PASSWORD: dataquery
      POSTGRES_DB: dataquery_test
    ports: ["55432:5432"]
    volumes: ["./docker/postgres-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataquery -d dataquery_test"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    # Lets the test user create triggers and functions while binary logging is on.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: dataquery
      MYSQL_DATABASE: dataquery_test
      MYSQL_USER: dataquery
      MYSQL_PASSWORD: dataquery
    ports: ["53306:3306"]
    volumes: ["./docker/mysql-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdataquery"]
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dataquery
      MARIADB_DATABASE: dataquery_test
      MARIADB_USER: dataquery
      MARIADB_PASSWORD: dataquery
    ports: ["53307:3306"]
    volumes: ["./docker/mysql-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Only published for x86-64; Docker runs it under emulation on Apple silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "DataQuery#2026"
    command: ["/bin/bash", "/seed/sqlserver-init.sh"]
    ports: ["51433:1433"]
    volumes:
      - ./docker/sqlserver-init.sh:/seed/sqlserver-init.sh:ro
      - ./docker/sqlserver-seed.sql:/seed/sqlserver-seed.sql:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/var/opt/mssql/.seeded"]
      interval: 3s
      retries: 100

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: dataquery
      APP_USER: dataquery
      APP_USER_PASSWORD: dataquery
    ports: ["51521:1521"]
    volumes: ["./docker/oracle-seed.sql:/container-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60

  cockroach:
    image: cockroachdb/cockroach:latest-v25.2
    command: ["start-single-node", "--insecure"]
    environment:
      COCKROACH_DATABASE: dataquery_test
    ports: ["56257:26257"]
    volumes: ["./docker/cockroach-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health?ready=1"]
      interval: 2s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: dataquery_test
      CLICKHOUSE_USER: dataquery
      CLICKHOUSE_PASSWORD: dataquery
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["58123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ["./docker/clickhouse-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 2s
      retries: 60

  # Snowflake emulator (fakesnow on DuckDB) speaking the Snowflake REST protocol.
  fakesnow:
    build: { context: docker, dockerfile: fakesnow.Dockerfile }
    ports: ["58000:8000"]

  # SSH bastion for tunnel tests; it reaches the databases by service name.
  ssh:
    build: { context: docker, dockerfile: ssh.Dockerfile }
    ports: ["52222:22"]
