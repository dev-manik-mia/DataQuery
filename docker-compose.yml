# Throwaway databases for integration tests and local development.
# Ports are offset so they never collide with a locally installed server.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dataquery
      POSTGRES_PASSWORD: dataquery
      POSTGRES_DB: dataquery_test
    ports: ["55432:5432"]
    volumes: ["./docker/postgres-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataquery -d dataquery_test"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    # Lets the test user create triggers and functions while binary logging is on.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: dataquery
      MYSQL_DATABASE: dataquery_test
      MYSQL_USER: dataquery
      MYSQL_PASSWORD: dataquery
    ports: ["53306:3306"]
    volumes: ["./docker/mysql-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdataquery"]
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dataquery
      MARIADB_DATABASE: dataquery_test
      MARIADB_USER: dataquery
      MARIADB_PASSWORD: dataquery
    ports: ["53307:3306"]
    volumes: ["./docker/mysql-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Only published for x86-64; Docker runs it under emulation on Apple silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "DataQuery#2026"
    command: ["/bin/bash", "/seed/sqlserver-init.sh"]
    ports: ["51433:1433"]
    volumes:
      - ./docker/sqlserver-init.sh:/seed/sqlserver-init.sh:ro
      - ./docker/sqlserver-seed.sql:/seed/sqlserver-seed.sql:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/var/opt/mssql/.seeded"]
      interval: 3s
      retries: 100

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: dataquery
      APP_USER: dataquery
      APP_USER_PASSWORD: dataquery
    ports: ["51521:1521"]
    volumes: ["./docker/oracle-seed.sql:/container-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60

  cockroach:
    image: cockroachdb/cockroach:latest-v25.2
    command: ["start-single-node", "--insecure"]
    environment:
      COCKROACH_DATABASE: dataquery_test
    ports: ["56257:26257"]
    volumes: ["./docker/cockroach-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health?ready=1"]
      interval: 2s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: dataquery_test
      CLICKHOUSE_USER: dataquery
      CLICKHOUSE_PASSWORD: dataquery
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["58123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ["./docker/clickhouse-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 2s
      retries: 60

  # Snowflake emulator (fakesnow on DuckDB) speaking the Snowflake REST protocol.
  fakesnow:
    build: { context: docker, dockerfile: fakesnow.Dockerfile }
    ports: ["58000:8000"]

  # Single-node replica set (transactions need one) with authentication. It
  # listens on 57017 inside too, so the advertised member address works from the host.
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: dataquery
      MONGO_INITDB_ROOT_PASSWORD: dataquery
      MONGO_INITDB_DATABASE: dataquery_test
    entrypoint: ["bash", "-c", "openssl rand -base64 756 > /tmp/rs.key && chmod 400 /tmp/rs.key && chown 999:999 /tmp/rs.key && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/rs.key --port 57017 --bind_ip_all"]
    ports: ["57017:57017"]
    volumes: ["./docker/mongodb-seed.js:/docker-entrypoint-initdb.d/seed.js:ro"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "57017", "-u", "dataquery", "-p", "dataquery", "--authenticationDatabase", "admin", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:57017' }] }).ok }"]
      interval: 3s
      retries: 60

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["58002:8000"]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "dataquery", "--databases", "16"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dataquery", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "dataquery"]
    ports: ["56380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "dataquery", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 30

  # Dragonfly (Redis-compatible); 16 databases like Redis, little memory for tests.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    command: ["--requirepass", "dataquery", "--dbnum", "16", "--proactor_threads", "1", "--maxmemory", "256mb", "--version_check=false"]
    ulimits:
      memlock: -1
    ports: ["56381:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a dataquery --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      retries: 30

  # Greenplum 7 (coordinator and two segments). The image trusts every client;
  # the test account is created once the cluster is up.
  greenplum:
    image: andruche/greenplum:7-2seg
    entrypoint: ["bash", "-c", "(until su - gpadmin -c 'psql -d postgres -c \"SELECT 1\"' >/dev/null 2>&1; do sleep 2; done; su - gpadmin -c 'psql -d postgres -f /seed/init.sql') & exec /entrypoint.sh"]
    ports: ["55433:5432"]
    volumes: ["./docker/greenplum-init.sql:/seed/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "su - gpadmin -c 'psql -h 127.0.0.1 -U dataquery -d dataquery_test -c \"SELECT 1\"' >/dev/null 2>&1"]
      interval: 3s
      retries: 60

  # Heavy optional servers run under profiles (see package.json db:up:wide / db:up:search):
  # all test databases together need more than the default 8 GB of Docker memory.
  # Cassandra 5 with password authentication (user cassandra / cassandra); slow to start.
  cassandra:
    profiles: ["wide"]
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: dataquery
      CASSANDRA_DC: dc1
    command: ["bash", "-c", "sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"]
    ports: ["59042:9042"]
    volumes: ["./docker/cassandra-seed.cql:/seed/seed.cql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 5s
      retries: 60

  scylla:
    profiles: ["wide"]
    image: scylladb/scylla:2025.1
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1", "--developer-mode", "1", "--skip-wait-for-gossip-to-settle", "0"]
    ports: ["59043:9042"]
    volumes: ["./docker/cassandra-seed.cql:/seed/seed.cql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 5s
      retries: 60

  # Elasticsearch 8 with security on (user elastic / dataquery) but plain HTTP.
  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: dataquery
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["59200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:dataquery http://localhost:9200/_cluster/health"]
      interval: 5s
      retries: 60

  neo4j:
    profiles: ["search"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/dataquery123
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["57687:7687", "57474:7474"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dataquery123 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      retries: 60

  # libSQL server (sqld, what Turso runs): Hrana over HTTP on :58080. Requests need
  # a JWT signed by this test-only Ed25519 key, like Turso database tokens; the
  # matching token is DATAQUERY_TEST_LIBSQL_TOKEN in package.json.
  libsql:
    profiles: ["libsql"]
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    environment:
      SQLD_AUTH_JWT_KEY: pgDGrptawVYE-009MvmoJaTmQi5uCtQH6iq5kRiDF0Q
    ports: ["58080:8080"]

  # BigQuery emulator (REST API v2 on ZetaSQL and SQLite), without authentication.
  bigquery:
    profiles: ["bigquery"]
    image: ghcr.io/goccy/bigquery-emulator:0.8.1
    command: ["--project=dataquery-test", "--port=9050"]
    ports: ["59050:9050"]

  # Vertica 25.4 Community Edition (26.1 and later dropped the CE license). The image
  # ships no database: the init script creates `vdb` (about two minutes) with users
  # dbadmin / dataquery and dataquery / dataquery123. Needs about 2 GB of memory.
  vertica:
    profiles: ["vertica"]
    image: opentext/vertica-k8s:25.4.0-0-multiarch
    user: "998:996"
    environment:
      VERTICA_DB: vdb
      VERTICA_PASSWORD: dataquery
    entrypoint: ["/bin/bash", "/seed/vertica-init.sh"]
    ports: ["55443:5433"]
    volumes:
      - ./docker/vertica-init.sh:/seed/vertica-init.sh:ro
      - ./docker/vertica-seed.sql:/seed/vertica-seed.sql:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/.seeded"]
      interval: 5s
      retries: 60

  # SingleStore dev image (root / dataquery, free bundled licence). amd64 only: emulated on Apple silicon.
  singlestore:
    profiles: ["singlestore"]
    image: ghcr.io/singlestore-labs/singlestoredb-dev:0.2.86
    platform: linux/amd64
    environment:
      ROOT_PASSWORD: dataquery
    ports: ["53308:3306"]

  # SSH bastion for tunnel tests; it reaches the databases by service name.
  ssh:
    build: { context: docker, dockerfile: ssh.Dockerfile }
    ports: ["52222:22"]
