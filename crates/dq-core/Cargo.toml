[package]
name = "dq-core"
description = "Engine-neutral types, traits and SQL utilities shared by every DataQuery adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustls.workspace = true
async-trait.workspace = true
csv.workspace = true
encoding_rs = "0.8"
encoding_rs_io = "0.1"
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["constant_memory"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
ts-rs.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
# Ends a backup tool's whole process group on cancel.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
