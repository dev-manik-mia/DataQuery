[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dataquery/dataquery"

[workspace.dependencies]
dq-core = { path = "crates/dq-core" }
dq-postgres = { path = "crates/dq-postgres" }
dq-mysql = { path = "crates/dq-mysql" }
dq-store = { path = "crates/dq-store" }
dq-ssh = { path = "crates/dq-ssh" }
dq-sqlserver = { path = "crates/dq-sqlserver" }
dq-oracle = { path = "crates/dq-oracle" }
dq-duckdb = { path = "crates/dq-duckdb" }
dq-clickhouse = { path = "crates/dq-clickhouse" }
dq-snowflake = { path = "crates/dq-snowflake" }
dq-mongodb = { path = "crates/dq-mongodb" }
dq-dynamodb = { path = "crates/dq-dynamodb" }
dq-redis = { path = "crates/dq-redis" }
dq-cassandra = { path = "crates/dq-cassandra" }

async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mongodb = { version = "3.3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
postgres-protocol = "0.6"
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "streams", "acl"] }
regex = "1"
scylla = { version = "1.9", features = ["rustls-023", "chrono-04", "num-bigint-04", "bigdecimal-04"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
thiserror = "2"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
oracle = "0.6"
duckdb = { version = "1.10506", features = ["bundled", "json", "parquet"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
# DbError carries user-facing context (code, hint, action); errors are rare, so size is irrelevant.
result_large_err = "allow"
# Capability and settings structs are flag sets by design.
struct_excessive_bools = "allow"
# Error mappers are used with `map_err`, which hands over ownership.
needless_pass_by_value = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
