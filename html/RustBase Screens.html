"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"afde96ac-71ec-4947-b291-6231b3b1c242\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>@font-face{\n  font-family: \"Manrope\";\n  font-style: normal;\n  font-weight: 200 800;          /* variable range, not a single weight */\n  font-display: swap;\n  src: url(\"8c24d39b-35c3-41c7-b0c2-211f048093bf\") format(\"woff2-variations\"),\n       url(\"8c24d39b-35c3-41c7-b0c2-211f048093bf\") format(\"woff2\");\n}\n@font-face{\n  font-family: \"JetBrains Mono\";\n  font-style: normal;\n  font-weight: 100 800;\n  font-display: swap;\n  src: url(\"f8502506-6fd4-4e23-8a58-3bbc028bc1c7\") format(\"woff2-variations\"),\n       url(\"f8502506-6fd4-4e23-8a58-3bbc028bc1c7\") format(\"woff2\");\n}\n@font-face{\n  font-family: \"JetBrains Mono\";\n  font-style: italic;\n  font-weight: 100 800;\n  font-display: swap;\n  src: url(\"052ad348-ca2e-4828-869f-a2a460ae1298\") format(\"woff2-variations\"),\n       url(\"052ad348-ca2e-4828-869f-a2a460ae1298\") format(\"woff2\");\n}\n@font-face{\n  font-family: \"Instrument Serif\";\n  font-style: normal;\n  font-weight: 400;              /* ships at one weight only */\n  font-display: swap;\n  src: url(\"e7c02ffc-da11-4cb2-8db5-3e72f7bd5c17\") format(\"woff2\");\n}\n@font-face{\n  font-family: \"Instrument Serif\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"240fddee-9430-4aa4-9f92-7a289edec2b5\") format(\"woff2\");\n}\n\n/* ==========================================================================\n   @compel/ui — tokens\n   Generated by ui/build.mjs from system/tokens.css. Do not edit here.\n   ========================================================================== */\n\n/* ============================================================================\n   Compel Design System — tokens\n   Kinetic Warm + Terracotta. Light and dark.\n\n   Three layers, in cascade order:\n     1. PALETTE   raw values, no meaning\n     2. SEMANTIC  purpose aliases, remapped per mode\n     3. COMPONENT component-specific, referencing semantic only\n\n   Rule: components never reference layer 1. If a component needs a value\n   that does not exist in layer 2, add it to layer 2 — do not reach past it.\n   ============================================================================ */\n\n/* ---------------------------------------------------------------------------\n   1. PALETTE\n   --------------------------------------------------------------------------- */\n:root {\n  /* Terracotta — the brand hue. Five stops, because one hex cannot be both\n     a fill and small text. */\n  --clay-200: #F3E9D8;  /* tint, light mode surfaces */\n  --clay-300: #E8AF88;  /* accent-as-text, dark mode on tint */\n  --clay-400: #E3A175;  /* accent-as-text, dark mode */\n  --clay-500: #D2793F;  /* fill, dark mode */\n  --clay-600: #B0552C;  /* fill, light mode — the brand colour */\n  --clay-700: #9C4A25;  /* accent-as-text, light mode */\n  --clay-800: #8A4120;  /* accent-as-text on tint, light mode; hard shadow */\n  --clay-900: #33231A;  /* tint, dark mode surfaces */\n\n  /* Warm neutrals. The ground is warm on purpose: terracotta on cool grey\n     reads industrial, on cream it reads editorial. */\n  --sand-50:  #FFFDF8;\n  --sand-100: #F6F1E8;\n  --sand-200: #EFE8DB;\n  --sand-300: #E3DACA;\n  --sand-400: #EDE6D9;\n  --stone-500: #6E655A;\n  --stone-600: #514A40;\n  --stone-700: #332B24;\n  --stone-800: #211C18;\n  --stone-900: #171310;\n  --stone-950: #100D0B;\n  --ink-900:  #1F1B16;\n  --ink-050:  #F6F1E9;\n  --ink-200:  #BFB4A6;\n  --ink-300:  #A39889;\n\n  /* Semantic hues. Each has a text tone and a surface tone, per mode. */\n  --green-700: #0B6E4C;  --green-100: #E2EFE5;\n  --green-400: #5CC492;  --green-950: #163025;\n  --amber-700: #8F6200;  --amber-100: #F5EDD9;\n  --amber-400: #D9A441;  --amber-950: #332714;\n  --red-700:   #B3261E;  --red-100:   #F8E6E1;\n  --red-400:   #F08878;  --red-950:   #361D1A;\n\n  /* Type */\n  --font-sans: \"Manrope\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n  --font-serif: \"Instrument Serif\", Georgia, serif; /* editorial accents only */\n\n  /* Type scale — ~1.2 ratio. Every size in the product is on this scale. */\n  --text-micro: 11px;   /* uppercase labels only */\n  --text-caption: 12px;\n  --text-ui: 13px;      /* dense UI default */\n  --text-body: 14px;\n  --text-body-lg: 16px;\n  --text-title-sm: 19px;\n  --text-title: 23px;\n  --text-display-sm: 28px;\n  --text-display: 34px;\n  --text-display-lg: 44px;\n  --text-hero: 64px;\n\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;   /* long-form prose only */\n\n  --track-display: -0.034em; /* Manrope 800 at display sizes */\n  --track-title: -0.02em;\n  --track-body: 0em;\n  --track-label: 0.1em;      /* uppercase micro labels */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-black: 800;       /* display only */\n\n  /* Space — 4pt base, 8pt rhythm above 12 */\n  --space-1: 4px;   --space-2: 8px;   --space-3: 12px;  --space-4: 16px;\n  --space-5: 20px;  --space-6: 24px;  --space-8: 32px;  --space-10: 40px;\n  --space-14: 56px; --space-20: 80px;\n\n  /* Geometry — square. 2px on everything, 0 on bar ends. */\n  --radius: 2px;\n  --radius-bar: 0px;\n\n  /* Motion */\n  --dur-color: 150ms;\n  --dur-move: 200ms;\n  --ease-inout: cubic-bezier(0.4, 0, 0.2, 1);\n  --ease-out: cubic-bezier(0, 0, 0.2, 1);\n\n  /* Focus */\n  --ring-w: 2px;\n  --ring-o: 2px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root { --dur-color: 1ms; --dur-move: 1ms; }\n}\n\n/* ---------------------------------------------------------------------------\n   2. SEMANTIC — light (default)\n   --------------------------------------------------------------------------- */\n:root,\n[data-mode=\"light\"] {\n  --bg: var(--sand-100);\n  --surface: var(--sand-50);\n  --sunk: var(--sand-200);\n\n  --ink: var(--ink-900);\n  --ink-2: var(--stone-600);   /* secondary text */\n  --ink-3: var(--stone-500);   /* muted text AND control boundaries */\n\n  --line: var(--sand-300);     /* DIVIDER — decorative, no contrast floor */\n  --line-2: var(--sand-400);\n  --border-control: var(--ink-3); /* INTERACTIVE BOUNDARY — must clear 3:1 */\n  --ring-color: var(--ink);    /* never the accent: see foundations */\n\n  --accent: var(--clay-600);        /* fill */\n  --accent-ink: #FFFFFF;            /* text on fill */\n  --accent-text: var(--clay-700);   /* accent AS text, on bg or surface */\n  --accent-on-tint: var(--clay-800);/* accent AS text, on the tint */\n  --accent-tint: var(--clay-200);   /* tinted surface */\n  --accent-shadow: var(--clay-800); /* hard offset */\n\n  --positive: var(--green-700);  --positive-tint: var(--green-100);\n  --caution:  var(--amber-700);  --caution-tint:  var(--amber-100);\n  --critical: var(--red-700);    --critical-tint: var(--red-100);\n\n  /* On-colours for the semantic fills. Same rule as --accent-ink: white in\n     light, near-black in dark. A hardcoded #fff on --critical measures 6.54:1\n     here and 2.47:1 in dark mode, which is why these are tokens. */\n  --positive-ink: #FFFFFF;   /* 6.27:1 on --positive */\n  --caution-ink:  #FFFFFF;   /* 5.36:1 on --caution  */\n  --critical-ink: #FFFFFF;   /* 6.54:1 on --critical */\n\n  /* Accent on an INVERTED ground. These two deliberately do NOT flip with the\n     mode: \"reversed\" already means the opposite ground, so flipping them would\n     cancel out. Used by the reversed logo lockup and by any dark panel dropped\n     into a light page. See 07-brand.md. */\n  --accent-on-dark:  var(--clay-400);  /* 7.84:1 on --ink-900  */\n  --accent-on-light: var(--clay-700);  /* 5.46:1 on --ink-050  */\n\n  --track: #F1EBDF;\n  --elevation-0: none;\n  --elevation-1: 0 1px 2px rgba(31, 27, 22, 0.05), 0 8px 22px rgba(31, 27, 22, 0.07);\n  --elevation-2: 0 8px 26px rgba(31, 27, 22, 0.14);\n}\n\n/* ---------------------------------------------------------------------------\n   2b. SEMANTIC — dark\n   Not an inversion. The fill lifts two stops (terracotta at --clay-600 is only\n   2.8:1 against a warm near-black, so it stops reading as a shape), the text\n   tone lifts three, and the tint moves to --clay-900 so tinted surfaces stay\n   surfaces rather than becoming highlights.\n   --------------------------------------------------------------------------- */\n[data-mode=\"dark\"] {\n  --bg: var(--stone-900);\n  --surface: var(--stone-800);\n  --sunk: var(--stone-950);\n\n  --ink: var(--ink-050);\n  --ink-2: var(--ink-200);\n  --ink-3: var(--ink-300);\n\n  --line: var(--stone-700);\n  --line-2: #28221C;\n  --border-control: var(--ink-3);\n  --ring-color: var(--ink);\n\n  --accent: var(--clay-500);\n  --accent-ink: #1A1714;            /* dark text on the lifted fill */\n  --accent-text: var(--clay-400);\n  --accent-on-tint: var(--clay-300);\n  --accent-tint: var(--clay-900);\n  --accent-shadow: var(--clay-800);\n\n  --positive: var(--green-400);  --positive-tint: var(--green-950);\n  --caution:  var(--amber-400);  --caution-tint:  var(--amber-950);\n  --critical: var(--red-400);    --critical-tint: var(--red-950);\n\n  /* The dark fills are light, so their on-colour inverts too. */\n  --positive-ink: #1A1714;   /* 8.30:1 */\n  --caution-ink:  #1A1714;   /* 7.94:1 */\n  --critical-ink: #1A1714;   /* 7.22:1 */\n\n  /* --accent-on-dark / --accent-on-light are NOT redefined here. That is the\n     point of them: they are ground-relative, not mode-relative. */\n\n  --track: #2B241E;\n  --elevation-0: none;\n  --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 22px rgba(0, 0, 0, 0.45);\n  --elevation-2: 0 8px 26px rgba(0, 0, 0, 0.6);\n}\n\n/* ---------------------------------------------------------------------------\n   3. COMPONENT\n   --------------------------------------------------------------------------- */\n:root {\n  --button-bg: var(--accent);\n  --button-ink: var(--accent-ink);\n  --button-shadow: 0 2px 0 var(--accent-shadow);\n  --button-weight: var(--weight-bold);\n  --button-pad-y: 9px;\n  --button-pad-x: 15px;\n\n  --input-h: 38px;\n  --input-border: var(--border-control);\n  --input-bg: var(--surface);\n\n  --card-bg: var(--surface);\n  --card-border: var(--line);\n  --card-shadow: var(--elevation-0);   /* flat: elevation is an affordance */\n  --card-pad: var(--space-4);\n\n  --gauge-h: 9px;\n  --gauge-rail: var(--track);\n  --gauge-fill: var(--accent);\n  --gauge-under: var(--caution);\n  --gauge-mark: var(--ink);            /* target tick */\n\n  --nav-active-bg: var(--accent-tint);\n  --nav-active-ink: var(--accent-on-tint);\n\n  --toast-bg: var(--ink);\n  --toast-ink: var(--bg);\n\n  --button-danger-bg: var(--critical);\n  --button-danger-ink: var(--critical-ink);\n\n  /* Brand lockup: Citation mark + full stop wordmark. Both brand colours are\n     accent roles, so they flip with the mode automatically. The period keeping\n     its light value on a dark ground measures 1.8:1 and vanishes -- which is\n     why it is a token and not a hardcoded hex. See 07-brand.md. */\n  --lockup-mark: var(--accent);\n  --lockup-letters: var(--ink);\n  --lockup-period: var(--accent-text);\n  --lockup-period-on-dark: var(--accent-on-dark);   /* reversed lockup */\n  --lockup-period-on-light: var(--accent-on-light);\n  --lockup-mark-scale: 1.37;           /* mark height / wordmark font-size */\n  --lockup-gap: 0.53em;                /* relative to wordmark font-size */\n  --lockup-clear: 0.25;                /* x mark height, all sides */\n  --lockup-tracking: -0.045em;\n  --lockup-weight: var(--weight-black);\n}\n\n\n/* ==========================================================================\n   @compel/ui — components\n   Generated by ui/build.mjs from ui/src/styles.css. Do not edit here.\n   ========================================================================== */\n\n/* ============================================================================\r\n   @compel/ui — component styles\r\n\r\n   Every value here comes from system/tokens.css. Nothing is hardcoded that a\r\n   token already names, and no component reaches past the semantic layer into\r\n   the palette (the rule stated at the top of tokens.css).\r\n\r\n   Class names are prefixed `cui-` and are an INTERNAL contract between these\r\n   components and this stylesheet. They are not a utility vocabulary — do not\r\n   compose layouts from them. Style your own layout with the tokens\r\n   (`var(--space-4)`, `var(--surface)`, …); see README.\r\n\r\n   Structured to mirror 02-app.md: states first, then components in spec order.\r\n   ============================================================================ */\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Every component root declares the DS face itself.\r\n\r\n   Inheriting it from `.cui-shell` looks fine in a full app and breaks the\r\n   moment a component is used on its own — which is exactly how a design agent\r\n   composes them. A root that only sets size and weight falls back to the\r\n   browser default serif. Declare the family at every root that renders text.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-pagehead,\r\n.cui-rows,\r\n.cui-row,\r\n.cui-crumbs,\r\n.cui-nav,\r\n.cui-navitem,\r\n.cui-sidebar,\r\n.cui-topbar,\r\n.cui-main,\r\n.cui-page,\r\n.cui-eyebrow,\r\n.cui-sentence,\r\n.cui-skeleton-stack,\r\n.cui-label,\r\n.cui-badge,\r\n.cui-avatar,\r\n.cui-alert,\r\n.cui-seg,\r\n.cui-tip__bubble,\r\n.cui-pop__panel,\r\n.cui-menu,\r\n.cui-dialog,\r\n.cui-sheet,\r\n.cui-otp,\r\n.cui-combo {\r\n  font-family: var(--font-sans);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Shared interactive states — 02-app.md \"Interactive states\"\r\n   Priority, highest first: disabled → loading → active → focus → hover.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-focusable:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n}\r\n\r\n/* :focus-visible, not :focus — pointer clicks should not ring. */\r\n.cui-focusable:focus:not(:focus-visible) {\r\n  outline: none;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Button\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-btn {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: var(--space-2);              /* 8px to an icon */\r\n  padding: var(--button-pad-y) var(--button-pad-x);\r\n  border: 1px solid transparent;\r\n  border-radius: var(--radius);\r\n  font-family: var(--font-sans);\r\n  font-size: var(--text-body);\r\n  font-weight: var(--button-weight);\r\n  line-height: var(--leading-tight);\r\n  letter-spacing: var(--track-body);\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n  text-decoration: none;\r\n  transition:\r\n    background-color var(--dur-color) var(--ease-inout),\r\n    border-color var(--dur-color) var(--ease-inout),\r\n    filter var(--dur-color) var(--ease-inout),\r\n    transform var(--dur-move) var(--ease-out),\r\n    box-shadow var(--dur-move) var(--ease-out);\r\n}\r\n\r\n.cui-btn--sm {\r\n  padding: 5px 11px;\r\n  font-size: var(--text-ui);\r\n}\r\n\r\n.cui-btn--primary {\r\n  background: var(--button-bg);\r\n  color: var(--button-ink);\r\n  box-shadow: var(--button-shadow);\r\n}\r\n\r\n.cui-btn--danger {\r\n  background: var(--button-danger-bg);\r\n  color: var(--button-danger-ink);\r\n  box-shadow: none;\r\n}\r\n\r\n.cui-btn--ghost {\r\n  background: transparent;\r\n  color: var(--ink-2);\r\n  border-color: var(--line);\r\n  box-shadow: none;\r\n}\r\n\r\n/* hover — brightness on filled, border shift on outlined */\r\n.cui-btn--primary:hover:not(:disabled),\r\n.cui-btn--danger:hover:not(:disabled) {\r\n  filter: brightness(0.96);\r\n}\r\n\r\n.cui-btn--ghost:hover:not(:disabled) {\r\n  border-color: var(--ink-2);\r\n  color: var(--ink);\r\n}\r\n\r\n/* active — press down, hard shadow collapses */\r\n.cui-btn:active:not(:disabled) {\r\n  transform: translateY(1px);\r\n  box-shadow: none;\r\n}\r\n\r\n/* disabled — outranks every other state */\r\n.cui-btn:disabled {\r\n  opacity: 0.45;\r\n  cursor: not-allowed;\r\n}\r\n\r\n.cui-btn:disabled:hover {\r\n  filter: none;\r\n  border-color: var(--line);\r\n}\r\n\r\n.cui-btn:disabled:active {\r\n  transform: none;\r\n}\r\n\r\n/* loading — control disabled, label retained, spinner added */\r\n.cui-btn[aria-busy='true'] {\r\n  cursor: progress;\r\n}\r\n\r\n.cui-spinner {\r\n  width: 13px;\r\n  height: 13px;\r\n  flex: none;\r\n  border: 2px solid currentColor;\r\n  border-right-color: transparent;\r\n  border-radius: 50%;\r\n  opacity: 0.8;\r\n  animation: cui-spin 600ms linear infinite;\r\n}\r\n\r\n@keyframes cui-spin {\r\n  to { transform: rotate(360deg); }\r\n}\r\n\r\n@media (prefers-reduced-motion: reduce) {\r\n  .cui-spinner { animation-duration: 2400ms; }\r\n}\r\n\r\n/* Money inside a label takes the mono face and tabular figures. */\r\n.cui-btn .cui-amount {\r\n  font-family: var(--font-mono);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Field — Input and Select share the control shell\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-field {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-1);\r\n  font-family: var(--font-sans);\r\n}\r\n\r\n.cui-field__label {\r\n  font-size: var(--text-caption);\r\n  font-weight: var(--weight-semibold);\r\n  color: var(--ink-2);\r\n}\r\n\r\n.cui-field__control {\r\n  height: var(--input-h);\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n  padding: 0 var(--space-3);\r\n  background: var(--input-bg);\r\n  color: var(--ink);\r\n  border: 1px solid var(--input-border);\r\n  border-radius: var(--radius);\r\n  font-family: inherit;\r\n  font-size: var(--text-body);\r\n  transition:\r\n    border-color var(--dur-color) var(--ease-inout),\r\n    background-color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n/* The trailing slot is positioned against the CONTROL, not the field: anchoring\r\n   it to the field's bottom edge made it jump the moment a hint or error\r\n   appeared underneath, landing on top of the message. */\r\n.cui-field__wrap {\r\n  position: relative;\r\n  display: block;\r\n}\r\n\r\n.cui-field__control--trailing {\r\n  padding-right: 38px;\r\n}\r\n\r\n.cui-field__trailing {\r\n  position: absolute;\r\n  top: 0;\r\n  right: var(--space-2);\r\n  height: var(--input-h);\r\n  display: inline-flex;\r\n  align-items: center;\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-field__control::placeholder {\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-field__control:hover:not(:disabled) {\r\n  border-color: var(--ink-2);\r\n}\r\n\r\n/* Focus takes the ring plus a border shift to --accent. */\r\n.cui-field__control:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n  border-color: var(--accent);\r\n}\r\n\r\n.cui-field__control:disabled {\r\n  opacity: 0.45;\r\n  cursor: not-allowed;\r\n}\r\n\r\n.cui-field--invalid .cui-field__control {\r\n  border-color: var(--critical);\r\n}\r\n\r\n.cui-field__message {\r\n  font-size: var(--text-caption);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-field__message--error {\r\n  color: var(--critical);\r\n}\r\n\r\n.cui-select__control {\r\n  appearance: none;\r\n  padding-right: var(--space-8);\r\n  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),\r\n                    linear-gradient(135deg, currentColor 50%, transparent 50%);\r\n  background-position: right 17px top 50%, right 12px top 50%;\r\n  background-size: 5px 5px, 5px 5px;\r\n  background-repeat: no-repeat;\r\n  cursor: pointer;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Checkbox — 18px box, 34px target\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-check {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  font-family: var(--font-sans);\r\n  font-size: var(--text-body);\r\n  color: var(--ink);\r\n  cursor: pointer;\r\n}\r\n\r\n.cui-check__box {\r\n  position: relative;\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 18px;\r\n  height: 18px;\r\n  flex: none;\r\n  /* --border-control, not --line: this is an interactive boundary and must\r\n     clear 3:1. */\r\n  border: 1px solid var(--border-control);\r\n  border-radius: var(--radius);\r\n  background: var(--surface);\r\n  transition:\r\n    background-color var(--dur-color) var(--ease-inout),\r\n    border-color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n/* 34px pointer target from an 18px box. */\r\n.cui-check__box::before {\r\n  content: '';\r\n  position: absolute;\r\n  inset: -8px;\r\n}\r\n\r\n.cui-check__input {\r\n  position: absolute;\r\n  width: 1px;\r\n  height: 1px;\r\n  opacity: 0;\r\n  margin: 0;\r\n}\r\n\r\n.cui-check__input:focus-visible + .cui-check__box {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n}\r\n\r\n.cui-check__input:checked + .cui-check__box {\r\n  background: var(--accent);\r\n  border-color: var(--accent);\r\n}\r\n\r\n/* The tick is always in the DOM. Unchecked hides it with a transparent\r\n   colour, so state rides on the border plus aria-checked and nothing is lost\r\n   for assistive tech. */\r\n.cui-check__tick {\r\n  color: transparent;\r\n  transition: color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n.cui-check__input:checked + .cui-check__box .cui-check__tick {\r\n  color: var(--accent-ink);\r\n}\r\n\r\n.cui-check__input:disabled + .cui-check__box {\r\n  opacity: 0.45;\r\n}\r\n\r\n.cui-check:has(.cui-check__input:disabled) {\r\n  cursor: not-allowed;\r\n  opacity: 0.45;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Card — flat, because elevation is an affordance\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-card {\r\n  background: var(--card-bg);\r\n  border: 1px solid var(--card-border);\r\n  border-radius: var(--radius);\r\n  box-shadow: var(--card-shadow);\r\n  overflow: hidden;                 /* rows clip to the radius */\r\n  font-family: var(--font-sans);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-card__head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: var(--space-3);\r\n  padding: 14px var(--space-4);\r\n  border-bottom: 1px solid var(--line);\r\n}\r\n\r\n.cui-card__title {\r\n  margin: 0;\r\n  font-size: var(--text-body);\r\n  font-weight: var(--weight-bold);\r\n  letter-spacing: var(--track-body);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-card__body {\r\n  padding: var(--card-pad);\r\n}\r\n\r\n.cui-card__body--flush {\r\n  padding: 0;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Table — grid, not <table>, so columns are tokenised\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-rows {\r\n  overflow-x: auto;                 /* wide tables scroll INSIDE their card */\r\n}\r\n\r\n.cui-row {\r\n  display: grid;\r\n  align-items: center;\r\n  gap: var(--space-3);\r\n  padding: var(--space-2) var(--space-4);\r\n  border-bottom: 1px solid var(--line-2);\r\n  font-size: var(--text-ui);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-row:last-child {\r\n  border-bottom: none;\r\n}\r\n\r\n.cui-row--head {\r\n  font-size: var(--text-micro);\r\n  text-transform: uppercase;\r\n  letter-spacing: var(--track-label);\r\n  font-weight: var(--weight-bold);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-row--clickable {\r\n  cursor: pointer;\r\n  text-align: left;\r\n  width: 100%;\r\n  background: none;\r\n  border-left: none;\r\n  border-right: none;\r\n  border-top: none;\r\n  font-family: inherit;\r\n  transition: background-color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n.cui-row--clickable:hover {\r\n  background: var(--sunk);\r\n}\r\n\r\n.cui-row--clickable:active {\r\n  background: var(--accent-tint);\r\n}\r\n\r\n.cui-row--clickable:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: calc(var(--ring-o) * -1);\r\n}\r\n\r\n.cui-cell {\r\n  min-width: 0;                     /* let the cell shrink; the row scrolls */\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n\r\n.cui-cell--numeric {\r\n  text-align: right;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.cui-cell--strong {\r\n  font-weight: var(--weight-semibold);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Gauge — the signature component\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-gauge {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-1);\r\n  font-family: var(--font-sans);\r\n  min-width: 0;\r\n}\r\n\r\n.cui-gauge__top {\r\n  display: flex;\r\n  align-items: baseline;\r\n  justify-content: space-between;\r\n  gap: var(--space-3);\r\n}\r\n\r\n.cui-gauge__label {\r\n  font-size: var(--text-caption);\r\n  color: var(--ink-2);\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n\r\n/* The numeral is always adjacent to the bar. That redundancy is what lets the\r\n   fill/rail ratio sit near 3:1 — the bar is never the sole conveyance. */\r\n.cui-gauge__value {\r\n  font-family: var(--font-mono);\r\n  font-variant-numeric: tabular-nums;\r\n  font-size: var(--text-caption);\r\n  font-weight: var(--weight-medium);\r\n  color: var(--ink);\r\n  flex: none;\r\n}\r\n\r\n.cui-gauge__rail {\r\n  position: relative;\r\n  height: var(--gauge-h);\r\n  background: var(--gauge-rail);\r\n  border-radius: var(--radius-bar);\r\n  overflow: visible;                /* the target tick extends past the rail */\r\n}\r\n\r\n.cui-gauge__fill {\r\n  height: 100%;\r\n  background: var(--gauge-fill);\r\n  border-radius: var(--radius-bar);\r\n  transition: width var(--dur-move) var(--ease-out);\r\n}\r\n\r\n.cui-gauge--under .cui-gauge__fill {\r\n  background: var(--gauge-under);\r\n}\r\n\r\n/* The target tick. This is what satisfies \"never convey by colour alone\" —\r\n   under-target reads as position against the tick, not just hue. */\r\n.cui-gauge__mark {\r\n  position: absolute;\r\n  top: -3px;\r\n  bottom: -3px;\r\n  width: 2px;\r\n  margin-left: -1px;\r\n  background: var(--gauge-mark);\r\n  opacity: 0.55;                    /* spec range: 38–70% */\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Status chip\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-chip {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: var(--space-1);\r\n  padding: 4px 11px;\r\n  border: 1px solid transparent;\r\n  border-radius: var(--radius);\r\n  font-family: var(--font-sans);\r\n  font-size: var(--text-micro);\r\n  font-weight: var(--weight-bold);\r\n  text-transform: uppercase;\r\n  letter-spacing: var(--track-label);\r\n  white-space: nowrap;\r\n}\r\n\r\n.cui-chip__dot {\r\n  width: 6px;\r\n  height: 6px;\r\n  flex: none;\r\n  border-radius: 50%;\r\n  background: currentColor;\r\n}\r\n\r\n.cui-chip--default {\r\n  background: var(--positive-tint);\r\n  color: var(--positive);\r\n}\r\n\r\n.cui-chip--caution {\r\n  background: var(--caution-tint);\r\n  color: var(--caution);\r\n}\r\n\r\n.cui-chip--critical {\r\n  background: var(--critical-tint);\r\n  color: var(--critical);\r\n}\r\n\r\n.cui-chip--mute {\r\n  background: transparent;\r\n  border-color: var(--line);\r\n  color: var(--ink-2);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Action bar — the one elevated element\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-actionbar {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: var(--space-4);\r\n  flex-wrap: wrap;\r\n  padding: 15px var(--space-4);\r\n  background: var(--surface);\r\n  border: 1px solid var(--line);\r\n  border-radius: var(--radius);\r\n  box-shadow: var(--elevation-1);\r\n  font-family: var(--font-sans);\r\n}\r\n\r\n.cui-actionbar__text {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 2px;\r\n  min-width: 0;\r\n}\r\n\r\n.cui-actionbar__actions {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  flex: none;\r\n}\r\n\r\n.cui-eyebrow {\r\n  font-size: var(--text-micro);\r\n  font-weight: var(--weight-bold);\r\n  text-transform: uppercase;\r\n  letter-spacing: var(--track-label);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-sentence {\r\n  font-size: var(--text-body);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-sentence .cui-amount {\r\n  font-family: var(--font-mono);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Toast\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-toast {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: var(--space-3);\r\n  max-width: 380px;\r\n  padding: var(--space-3) var(--space-4);\r\n  background: var(--toast-bg);\r\n  color: var(--toast-ink);\r\n  border-radius: var(--radius);\r\n  box-shadow: var(--elevation-2);\r\n  font-family: var(--font-sans);\r\n  font-size: var(--text-body);\r\n  line-height: var(--leading-snug);\r\n}\r\n\r\n.cui-toast__dot {\r\n  width: 6px;\r\n  height: 6px;\r\n  flex: none;\r\n  margin-top: 6px;\r\n  border-radius: 50%;\r\n  background: var(--accent);\r\n}\r\n\r\n.cui-toast--critical .cui-toast__dot {\r\n  background: var(--critical);\r\n}\r\n\r\n.cui-toast__body {\r\n  min-width: 0;\r\n}\r\n\r\n.cui-toasts {\r\n  position: fixed;\r\n  right: var(--space-6);\r\n  bottom: var(--space-6);\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-2);\r\n  z-index: 40;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Shell — sidebar, topbar, page\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-shell {\r\n  display: grid;\r\n  /* minmax(0, 1fr), never 1fr: grid items default to min-width auto and would\r\n     refuse to shrink, pushing the page sideways instead of letting a table\r\n     scroll. This was a real bug. */\r\n  grid-template-columns: 250px minmax(0, 1fr);\r\n  min-height: 100%;\r\n  background: var(--bg);\r\n  color: var(--ink);\r\n  font-family: var(--font-sans);\r\n  font-size: var(--text-body);\r\n}\r\n\r\n.cui-shell--collapsed {\r\n  grid-template-columns: 66px minmax(0, 1fr);\r\n}\r\n\r\n@media (max-width: 840px) {\r\n  .cui-shell,\r\n  .cui-shell--collapsed {\r\n    grid-template-columns: minmax(0, 1fr);\r\n  }\r\n  .cui-sidebar {\r\n    display: none;\r\n  }\r\n}\r\n\r\n.cui-sidebar {\r\n  position: sticky;\r\n  top: 0;\r\n  align-self: start;\r\n  max-height: 100vh;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-4);\r\n  padding: var(--space-4) var(--space-3);\r\n  background: var(--surface);\r\n  border-right: 1px solid var(--line);\r\n  overflow-y: auto;\r\n}\r\n\r\n.cui-sidebar__head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: var(--space-2);\r\n}\r\n\r\n.cui-sidebar__foot {\r\n  margin-top: auto;\r\n  padding-top: var(--space-3);\r\n  border-top: 1px solid var(--line);\r\n}\r\n\r\n.cui-nav {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 2px;\r\n}\r\n\r\n.cui-nav__group {\r\n  padding: var(--space-3) var(--space-2) var(--space-1);\r\n  font-size: var(--text-micro);\r\n  font-weight: var(--weight-bold);\r\n  text-transform: uppercase;\r\n  letter-spacing: var(--track-label);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-navitem {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  padding: var(--space-2) 10px;\r\n  border: none;\r\n  border-radius: var(--radius);\r\n  background: transparent;\r\n  color: var(--ink-2);\r\n  font-family: inherit;\r\n  font-size: var(--text-ui);\r\n  font-weight: var(--weight-semibold);\r\n  text-align: left;\r\n  text-decoration: none;\r\n  cursor: pointer;\r\n  transition:\r\n    background-color var(--dur-color) var(--ease-inout),\r\n    color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n.cui-navitem:hover {\r\n  background: var(--sunk);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-navitem:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n}\r\n\r\n.cui-navitem--active {\r\n  background: var(--nav-active-bg);\r\n  color: var(--nav-active-ink);\r\n}\r\n\r\n.cui-navitem__label {\r\n  flex: 1;\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n\r\n/* --ink-2, NOT --ink-3: the active row sits on the accent tint, whose\r\n   luminance moves with the accent, and --ink-3 dropped to 4.45:1 on some\r\n   tints. */\r\n.cui-navitem__count {\r\n  flex: none;\r\n  font-variant-numeric: tabular-nums;\r\n  font-size: var(--text-caption);\r\n  color: var(--ink-2);\r\n}\r\n\r\n.cui-navitem--active .cui-navitem__count {\r\n  color: inherit;\r\n}\r\n\r\n.cui-navitem__icon {\r\n  flex: none;\r\n  display: inline-flex;\r\n}\r\n\r\n.cui-main {\r\n  display: flex;\r\n  flex-direction: column;\r\n  min-width: 0;\r\n}\r\n\r\n.cui-topbar {\r\n  position: sticky;\r\n  top: 0;\r\n  z-index: 20;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: var(--space-4);\r\n  min-height: 52px;\r\n  padding: var(--space-2) var(--space-6);\r\n  background: var(--bg);\r\n  border-bottom: 1px solid var(--line);\r\n}\r\n\r\n.cui-topbar__right {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  flex: none;\r\n}\r\n\r\n.cui-crumbs {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  min-width: 0;\r\n  font-size: var(--text-ui);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-crumbs__link {\r\n  color: var(--ink-2);\r\n  text-decoration: none;\r\n  border-radius: var(--radius);\r\n}\r\n\r\n.cui-crumbs__link:hover {\r\n  color: var(--ink);\r\n  text-decoration: underline;\r\n}\r\n\r\n.cui-crumbs__link:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n}\r\n\r\n.cui-crumbs__current {\r\n  color: var(--ink);\r\n  font-weight: var(--weight-semibold);\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n\r\n.cui-crumbs__sep {\r\n  color: var(--ink-3);\r\n  flex: none;\r\n}\r\n\r\n.cui-page {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-4);              /* content stack, gap 16 */\r\n  padding: var(--space-6);\r\n  min-width: 0;\r\n}\r\n\r\n@media (max-width: 720px) {\r\n  .cui-page {\r\n    padding: var(--space-4);\r\n  }\r\n  .cui-topbar {\r\n    padding: var(--space-2) var(--space-4);\r\n  }\r\n}\r\n\r\n.cui-pagehead {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  justify-content: space-between;\r\n  gap: var(--space-4);\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.cui-pagehead__text {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-1);\r\n  min-width: 0;\r\n}\r\n\r\n.cui-pagehead__title {\r\n  margin: 0;\r\n  font-size: var(--text-display-sm);\r\n  font-weight: var(--weight-black);\r\n  letter-spacing: var(--track-display);\r\n  line-height: var(--leading-tight);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-pagehead__statement {\r\n  font-size: var(--text-body-lg);\r\n  color: var(--ink-2);\r\n  line-height: var(--leading-snug);\r\n  max-width: 62ch;\r\n}\r\n\r\n.cui-pagehead__aside {\r\n  flex: none;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Empty, loading, error — required for every data surface\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-state {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: flex-start;\r\n  gap: var(--space-3);\r\n  padding: var(--space-8) var(--space-4);\r\n  font-family: var(--font-sans);\r\n}\r\n\r\n.cui-state--center {\r\n  align-items: center;\r\n  text-align: center;\r\n}\r\n\r\n.cui-state__title {\r\n  font-size: var(--text-body-lg);\r\n  font-weight: var(--weight-bold);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-state__body {\r\n  font-size: var(--text-body);\r\n  color: var(--ink-2);\r\n  max-width: 52ch;\r\n  line-height: var(--leading-snug);\r\n}\r\n\r\n.cui-state--error .cui-state__title {\r\n  color: var(--critical);\r\n}\r\n\r\n.cui-error-inline {\r\n  display: flex;\r\n  gap: var(--space-2);\r\n  padding: var(--space-3) var(--space-4);\r\n  background: var(--critical-tint);\r\n  border-left: 2px solid var(--critical);\r\n  border-radius: var(--radius);\r\n  font-family: var(--font-sans);\r\n  font-size: var(--text-body);\r\n  color: var(--ink);\r\n  line-height: var(--leading-snug);\r\n}\r\n\r\n/* Skeleton — the final shape, not a centred spinner. */\r\n.cui-skeleton {\r\n  background: var(--sunk);\r\n  border-radius: var(--radius);\r\n  animation: cui-pulse 1400ms var(--ease-inout) infinite;\r\n}\r\n\r\n@keyframes cui-pulse {\r\n  0%, 100% { opacity: 1; }\r\n  50% { opacity: 0.55; }\r\n}\r\n\r\n@media (prefers-reduced-motion: reduce) {\r\n  .cui-skeleton { animation: none; }\r\n}\r\n\r\n.cui-skeleton-stack {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-2);\r\n  width: 100%;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Logo — the Citation mark + full stop wordmark\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-logo {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  vertical-align: middle;\r\n}\r\n\r\n.cui-logo svg {\r\n  display: block;\r\n  height: auto;\r\n}\r\n\r\n/* ============================================================================\r\n   Components beyond 02-app.md\r\n\r\n   02-app.md specifies ten components. These are what the product actually needs\r\n   on top of that — derived from the same principles rather than from a written\r\n   spec, so each states which principle it follows: square 2px, flat except\r\n   where elevation means \"above the page\", tokens only, all seven interactive\r\n   states, and the accessibility criteria in that same document.\r\n   ============================================================================ */\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Spinner — the loading glyph, standalone\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-spinner--accent  { color: var(--accent); }\r\n.cui-spinner--ink     { color: var(--ink-2); }\r\n.cui-spinner--current { color: currentColor; }\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Label — the form label, on its own\r\n\r\n   Input and Select render their own. This is for what they cannot cover: a\r\n   checkbox group's legend, a field built from parts, a radio set.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-label {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: var(--space-1);\r\n  font-size: var(--text-caption);\r\n  font-weight: var(--weight-semibold);\r\n  color: var(--ink-2);\r\n}\r\n\r\n.cui-label__required { color: var(--critical); }\r\n\r\n.cui-label--disabled { opacity: 0.45; }\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Textarea — the control shell, taller\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-textarea {\r\n  min-height: 88px;\r\n  height: auto;\r\n  padding: var(--space-2) var(--space-3);\r\n  line-height: var(--leading-snug);\r\n  resize: vertical;\r\n  font-family: var(--font-sans);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Badge — a count, or a neutral label\r\n\r\n   Deliberately distinct from StatusChip: a chip carries STATE and is tinted by\r\n   tone, a badge carries a QUANTITY and stays neutral unless told otherwise.\r\n   Using a tinted chip for a count is what makes an interface look alarmed.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-badge {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  min-width: 18px;\r\n  padding: 1px 6px;\r\n  border: 1px solid transparent;\r\n  border-radius: var(--radius);\r\n  font-size: var(--text-micro);\r\n  font-weight: var(--weight-bold);\r\n  font-variant-numeric: tabular-nums;\r\n  line-height: 1.5;\r\n  white-space: nowrap;\r\n}\r\n\r\n.cui-badge--neutral { background: var(--sunk); color: var(--ink-2); }\r\n.cui-badge--accent  { background: var(--accent-tint); color: var(--accent-on-tint); }\r\n.cui-badge--solid   { background: var(--accent); color: var(--accent-ink); }\r\n.cui-badge--outline { background: transparent; border-color: var(--line); color: var(--ink-2); }\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Separator\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-sep {\r\n  border: 0;\r\n  background: var(--line);\r\n  flex: none;\r\n}\r\n\r\n.cui-sep--h { height: 1px; width: 100%; margin: 0; }\r\n.cui-sep--v { width: 1px; align-self: stretch; min-height: 1em; margin: 0; }\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Avatar — initials, or an image\r\n\r\n   Square, like everything else. A circular avatar would be the only round\r\n   thing in the system.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-avatar {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex: none;\r\n  overflow: hidden;\r\n  border-radius: var(--radius);\r\n  background: var(--accent-tint);\r\n  color: var(--accent-on-tint);\r\n  font-weight: var(--weight-bold);\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.02em;\r\n  user-select: none;\r\n}\r\n\r\n.cui-avatar--neutral { background: var(--sunk); color: var(--ink-2); }\r\n\r\n.cui-avatar img {\r\n  width: 100%;\r\n  height: 100%;\r\n  object-fit: cover;\r\n  display: block;\r\n}\r\n\r\n.cui-avatar-stack { display: inline-flex; align-items: center; }\r\n\r\n.cui-avatar-stack > .cui-avatar + .cui-avatar {\r\n  margin-left: -6px;\r\n  box-shadow: 0 0 0 2px var(--surface);\r\n}\r\n\r\n/* Each overlapped tile loses 8px off its right edge — 6px of overlap plus the\r\n   next tile's 2px ring — so centred initials had their trailing glyph cut at\r\n   every usable size. The content is re-centred in the width that is actually\r\n   visible. An image is unaffected: it is cover-fit and has no glyph to lose. */\r\n.cui-avatar-stack > .cui-avatar:not(:last-child) > span:not(:has(img)) {\r\n  transform: translateX(-4px);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Alert — a message about the page, not about a field\r\n\r\n   Field validation belongs on Input's error prop; a failed data surface belongs\r\n   to ErrorState. This is the band between them: something the user should know\r\n   before acting. Tone rides on a 2px left rule as well as the tint, so it is\r\n   never colour alone.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-alert {\r\n  display: flex;\r\n  gap: var(--space-3);\r\n  padding: var(--space-3) var(--space-4);\r\n  border: 1px solid var(--line);\r\n  border-left-width: 2px;\r\n  border-radius: var(--radius);\r\n  background: var(--surface);\r\n  font-size: var(--text-body);\r\n  line-height: var(--leading-snug);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-alert--info     { border-left-color: var(--ink-3); }\r\n.cui-alert--positive { border-left-color: var(--positive); background: var(--positive-tint); }\r\n.cui-alert--caution  { border-left-color: var(--caution);  background: var(--caution-tint); }\r\n.cui-alert--critical { border-left-color: var(--critical); background: var(--critical-tint); }\r\n\r\n.cui-alert__body { min-width: 0; flex: 1; }\r\n\r\n.cui-alert__title {\r\n  display: block;\r\n  font-weight: var(--weight-bold);\r\n  margin-bottom: 2px;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Segmented control — a small set of mutually exclusive choices\r\n\r\n   A radiogroup, not a row of buttons: arrow keys move between options and only\r\n   the selected one sits in the tab order.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-seg {\r\n  display: inline-flex;\r\n  padding: 2px;\r\n  gap: 2px;\r\n  background: var(--sunk);\r\n  border: 1px solid var(--line);\r\n  border-radius: var(--radius);\r\n}\r\n\r\n.cui-seg__opt {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: var(--space-1);\r\n  min-height: 26px;\r\n  padding: 4px 10px;\r\n  border: none;\r\n  border-radius: var(--radius);\r\n  background: transparent;\r\n  color: var(--ink-2);\r\n  font-family: inherit;\r\n  font-size: var(--text-ui);\r\n  font-weight: var(--weight-semibold);\r\n  cursor: pointer;\r\n  transition:\r\n    background-color var(--dur-color) var(--ease-inout),\r\n    color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n.cui-seg__opt:hover:not(:disabled) { color: var(--ink); }\r\n\r\n.cui-seg__opt:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n}\r\n\r\n.cui-seg__opt-on {\r\n  background: var(--surface);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-seg__opt:disabled { opacity: 0.45; cursor: not-allowed; }\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Anchored surfaces — Tooltip, Popover, DropdownMenu\r\n\r\n   All three anchor to their trigger with absolute positioning inside a relative\r\n   wrapper. There is no collision detection: near a viewport edge they overflow\r\n   rather than flip. That is a deliberate limit — a positioning engine is a\r\n   dependency this system does not carry — so keep them away from edges and\r\n   prefer align=\"end\" on the right-hand side of a layout.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-anchor {\r\n  position: relative;\r\n  display: inline-flex;\r\n}\r\n\r\n.cui-tip__bubble,\r\n.cui-pop__panel,\r\n.cui-menu {\r\n  position: absolute;\r\n  z-index: 30;\r\n  border-radius: var(--radius);\r\n}\r\n\r\n/* Tooltip — a hint. Never the only place information lives. */\r\n.cui-tip__bubble {\r\n  /* The anchor is inline-flex and sizes to its trigger, so without this the\r\n     bubble shrink-fits to the trigger and max-width never applies. */\r\n  width: max-content;\r\n  max-width: 240px;\r\n  padding: 6px 10px;\r\n  background: var(--toast-bg);\r\n  color: var(--toast-ink);\r\n  font-size: var(--text-caption);\r\n  line-height: var(--leading-snug);\r\n  box-shadow: var(--elevation-2);\r\n  pointer-events: none;\r\n  white-space: normal;\r\n}\r\n\r\n.cui-pop__panel,\r\n.cui-menu {\r\n  min-width: 180px;\r\n  background: var(--surface);\r\n  border: 1px solid var(--line);\r\n  box-shadow: var(--elevation-2);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-pop__panel { padding: var(--space-3); }\r\n\r\n.cui-menu { padding: var(--space-1); }\r\n\r\n.cui-anchor--top    > .cui-tip__bubble,\r\n.cui-anchor--top    > .cui-pop__panel,\r\n.cui-anchor--top    > .cui-menu { bottom: calc(100% + 6px); }\r\n\r\n.cui-anchor--bottom > .cui-tip__bubble,\r\n.cui-anchor--bottom > .cui-pop__panel,\r\n.cui-anchor--bottom > .cui-menu { top: calc(100% + 6px); }\r\n\r\n.cui-anchor--start  > .cui-tip__bubble,\r\n.cui-anchor--start  > .cui-pop__panel,\r\n.cui-anchor--start  > .cui-menu { left: 0; }\r\n\r\n.cui-anchor--end    > .cui-tip__bubble,\r\n.cui-anchor--end    > .cui-pop__panel,\r\n.cui-anchor--end    > .cui-menu { right: 0; }\r\n\r\n.cui-menu__item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  width: 100%;\r\n  /* Required: <a> defaults to content-box, so width:100% plus the padding\r\n     overflowed the panel — while the <button> variant looked correct because\r\n     form controls already default to border-box. */\r\n  box-sizing: border-box;\r\n  min-height: 28px;\r\n  padding: var(--space-2) 10px;\r\n  border: none;\r\n  border-radius: var(--radius);\r\n  background: transparent;\r\n  color: var(--ink);\r\n  font-family: inherit;\r\n  font-size: var(--text-ui);\r\n  font-weight: var(--weight-medium);\r\n  text-align: left;\r\n  text-decoration: none;\r\n  cursor: pointer;\r\n  transition: background-color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n.cui-menu__item:hover:not(:disabled) { background: var(--sunk); }\r\n\r\n.cui-menu__item:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: calc(var(--ring-o) * -1);\r\n}\r\n\r\n.cui-menu__item:disabled { opacity: 0.45; cursor: not-allowed; }\r\n\r\n.cui-menu__item--danger { color: var(--critical); }\r\n\r\n.cui-menu__label {\r\n  padding: var(--space-2) 10px var(--space-1);\r\n  font-size: var(--text-micro);\r\n  font-weight: var(--weight-bold);\r\n  text-transform: uppercase;\r\n  letter-spacing: var(--track-label);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-menu__shortcut {\r\n  margin-left: auto;\r\n  font-family: var(--font-mono);\r\n  font-size: var(--text-caption);\r\n  color: var(--ink-3);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Dialog and Sheet — above the page\r\n\r\n   Elevation here is not decoration. The ActionBar rule says elevation marks a\r\n   commitment point on the page; a modal sits above the page entirely. Both use\r\n   --elevation-2, the same step as the toast.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-scrim {\r\n  position: fixed;\r\n  inset: 0;\r\n  z-index: 50;\r\n  display: flex;\r\n  background: color-mix(in srgb, var(--ink) 45%, transparent);\r\n  animation: cui-fade var(--dur-color) var(--ease-out);\r\n}\r\n\r\n.cui-scrim--center { align-items: center; justify-content: center; padding: var(--space-6); }\r\n.cui-scrim--end    { justify-content: flex-end; }\r\n.cui-scrim--start  { justify-content: flex-start; }\r\n\r\n@keyframes cui-fade { from { opacity: 0; } }\r\n\r\n@media (prefers-reduced-motion: reduce) {\r\n  .cui-scrim, .cui-dialog { animation: none; }\r\n}\r\n\r\n.cui-dialog {\r\n  display: flex;\r\n  flex-direction: column;\r\n  width: 100%;\r\n  max-width: 520px;\r\n  max-height: 100%;\r\n  background: var(--surface);\r\n  border: 1px solid var(--line);\r\n  border-radius: var(--radius);\r\n  box-shadow: var(--elevation-2);\r\n  color: var(--ink);\r\n  animation: cui-rise var(--dur-move) var(--ease-out);\r\n}\r\n\r\n@keyframes cui-rise { from { transform: translateY(4px); opacity: 0; } }\r\n\r\n.cui-sheet {\r\n  display: flex;\r\n  flex-direction: column;\r\n  width: 100%;\r\n  max-width: 420px;\r\n  height: 100%;\r\n  background: var(--surface);\r\n  border-left: 1px solid var(--line);\r\n  box-shadow: var(--elevation-2);\r\n  color: var(--ink);\r\n}\r\n\r\n.cui-scrim--start > .cui-sheet {\r\n  border-left: none;\r\n  border-right: 1px solid var(--line);\r\n}\r\n\r\n.cui-dialog__head,\r\n.cui-sheet__head {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  justify-content: space-between;\r\n  gap: var(--space-3);\r\n  padding: var(--space-4);\r\n  border-bottom: 1px solid var(--line);\r\n}\r\n\r\n.cui-dialog__title,\r\n.cui-sheet__title {\r\n  margin: 0;\r\n  font-size: var(--text-title-sm);\r\n  font-weight: var(--weight-bold);\r\n  letter-spacing: var(--track-title);\r\n  line-height: var(--leading-snug);\r\n}\r\n\r\n.cui-dialog__desc,\r\n.cui-sheet__desc {\r\n  margin: var(--space-1) 0 0;\r\n  font-size: var(--text-body);\r\n  color: var(--ink-2);\r\n  line-height: var(--leading-snug);\r\n}\r\n\r\n.cui-dialog__body,\r\n.cui-sheet__body {\r\n  padding: var(--space-4);\r\n  overflow-y: auto;\r\n  flex: 1;\r\n  min-height: 0;\r\n}\r\n\r\n.cui-dialog__foot,\r\n.cui-sheet__foot {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: flex-end;\r\n  gap: var(--space-2);\r\n  padding: var(--space-3) var(--space-4);\r\n  border-top: 1px solid var(--line);\r\n}\r\n\r\n.cui-close {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 28px;\r\n  height: 28px;\r\n  flex: none;\r\n  border: none;\r\n  border-radius: var(--radius);\r\n  background: transparent;\r\n  color: var(--ink-3);\r\n  cursor: pointer;\r\n  transition:\r\n    background-color var(--dur-color) var(--ease-inout),\r\n    color var(--dur-color) var(--ease-inout);\r\n}\r\n\r\n.cui-close:hover { background: var(--sunk); color: var(--ink); }\r\n\r\n.cui-close:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   One-time code — a fixed number of single characters\r\n\r\n   Mono and tabular, so the boxes do not shift width between digits.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-otp { display: inline-flex; gap: var(--space-2); }\r\n\r\n.cui-otp__slot {\r\n  width: 40px;\r\n  height: 46px;\r\n  padding: 0;\r\n  text-align: center;\r\n  background: var(--input-bg);\r\n  color: var(--ink);\r\n  border: 1px solid var(--input-border);\r\n  border-radius: var(--radius);\r\n  font-family: var(--font-mono);\r\n  font-variant-numeric: tabular-nums;\r\n  font-size: var(--text-title-sm);\r\n  font-weight: var(--weight-medium);\r\n}\r\n\r\n.cui-otp__slot:focus-visible {\r\n  outline: var(--ring-w) solid var(--ring-color);\r\n  outline-offset: var(--ring-o);\r\n  border-color: var(--accent);\r\n}\r\n\r\n.cui-otp--invalid .cui-otp__slot { border-color: var(--critical); }\r\n\r\n/* Every other control in the system dims to 0.45 when disabled; without this\r\n   a disabled code entry was pixel-identical to an enabled one. */\r\n.cui-otp__slot:disabled {\r\n  opacity: 0.45;\r\n  cursor: not-allowed;\r\n}\r\n\r\n/* ---------------------------------------------------------------------------\r\n   Searchable select — a combobox\r\n\r\n   For lists too long to scan in a native select. The filter input IS the\r\n   control; the listbox anchors beneath it.\r\n   --------------------------------------------------------------------------- */\r\n\r\n.cui-combo {\r\n  position: relative;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: var(--space-1);\r\n}\r\n\r\n.cui-combo__list {\r\n  position: absolute;\r\n  top: calc(100% + 4px);\r\n  left: 0;\r\n  right: 0;\r\n  z-index: 30;\r\n  max-height: 240px;\r\n  overflow-y: auto;\r\n  margin: 0;\r\n  padding: var(--space-1);\r\n  list-style: none;\r\n  background: var(--surface);\r\n  border: 1px solid var(--line);\r\n  border-radius: var(--radius);\r\n  box-shadow: var(--elevation-2);\r\n}\r\n\r\n.cui-combo__opt {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: var(--space-2);\r\n  min-height: 28px;\r\n  padding: var(--space-2) 10px;\r\n  border-radius: var(--radius);\r\n  font-size: var(--text-ui);\r\n  color: var(--ink);\r\n  cursor: pointer;\r\n}\r\n\r\n.cui-combo__opt-on { background: var(--accent-tint); color: var(--accent-on-tint); }\r\n.cui-combo__opt--active { background: var(--sunk); }\r\n\r\n.cui-combo__empty {\r\n  padding: var(--space-3) 10px;\r\n  font-size: var(--text-ui);\r\n  color: var(--ink-3);\r\n}\r\n\r\n.cui-combo__check { margin-left: auto; flex: none; }\r\n\n<\u002Fstyle>\n<style>:root, [data-mode=\"light\"] {\n  --font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI Variable\", \"Segoe UI\", system-ui, sans-serif;\n  --bg: #F7F8FA; --surface: #FFFFFF; --sunk: #EEF0F3;\n  --ink: #1E2024; --ink-2: #4C525C; --ink-3: #676D77;\n  --line: #E1E4E8; --line-2: #EAECEF; --border-control: #8A9099;\n  --accent: #2F6BE6; --accent-ink: #FFFFFF; --accent-text: #2459C9; --accent-tint: #E7EEFD; --accent-on-tint: #1D4BAF; --accent-shadow: transparent;\n  --positive: #1F7A3F; --positive-tint: #E4F3EA; --caution: #865800; --caution-tint: #FBF0D9; --critical: #C42B2B; --critical-tint: #FCE8E8;\n  --track: #E6E9EE; --nav-active-bg: #E1EAFC; --nav-active-ink: #1D4BAF;\n  --toast-bg: #1E2024; --toast-ink: #F7F8FA; --ring-color: #2F6BE6;\n  --syn-kw: #A33B8A; --syn-type: #2459C9;\n  --elevation-1: 0 1px 2px rgba(20,24,32,.06), 0 8px 24px rgba(20,24,32,.10);\n  --elevation-2: 0 2px 6px rgba(20,24,32,.10), 0 16px 40px rgba(20,24,32,.16);\n}\n[data-mode=\"dark\"] {\n  --font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI Variable\", \"Segoe UI\", system-ui, sans-serif;\n  --bg: #1C1E22; --surface: #23252A; --sunk: #18191C;\n  --ink: #DFE1E5; --ink-2: #A9AEB8; --ink-3: #8A909B;\n  --line: #31343A; --line-2: #2B2E33; --border-control: #565B64;\n  --accent: #3574F0; --accent-ink: #FFFFFF; --accent-text: #73A5FF; --accent-tint: #23314D; --accent-on-tint: #B3CCFF; --accent-shadow: transparent;\n  --positive: #67BF80; --positive-tint: #1E3327; --caution: #E2B358; --caution-tint: #3A3121; --critical: #F2786F; --critical-tint: #3F2426;\n  --track: #31343A; --nav-active-bg: #2D3E60; --nav-active-ink: #DCE6FF;\n  --toast-bg: #DFE1E5; --toast-ink: #1C1E22; --ring-color: #73A5FF;\n  --syn-kw: #DB9A6E; --syn-type: #73A5FF;\n  --elevation-1: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);\n  --elevation-2: 0 2px 6px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;background:var(--sunk);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\na{color:var(--accent-text)} a:hover{color:var(--accent-on-tint)}\n*{box-sizing:border-box}\nbutton{font-family:var(--font-sans)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-mode=\"{{ mode }}\" style=\"background:var(--sunk);color:var(--ink);font-family:var(--font-sans);padding:80px;min-width:3100px;display:flex;flex-direction:column;gap:56px\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px;max-width:900px\">\n  <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:16px;height:16px;background:var(--accent);border-radius:4px\"><\u002Fdiv><div style=\"font-size:19px;font-weight:800;letter-spacing:-0.02em\">RustBase<\u002Fdiv><\u002Fdiv>\n  <h1 style=\"margin:0;font-size:34px;font-weight:800;letter-spacing:-0.034em\">UI screens · multi-engine<\u002Fh1>\n  <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--ink-2)\">Desktop windows at 1440 × 900. PostgreSQL is the MVP engine. Other engines follow the roadmap in 02a and 15; screens 12–14 are designed ahead and labelled with their priority. Tokens and patterns: <a href=\"RustBase Design System v2.dc.html\">RustBase Design System<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:80px;align-items:flex-start\">\n\n<!-- 01 WELCOME -->\n<div id=\"s01\" style=\"display:flex;flex-direction:column;gap:12px\">\n  <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:4px\">01<\u002Fspan><span style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em\">Welcome · connections<\u002Fspan><span style=\"font-size:12px;color:var(--ink-3)\">P0<\u002Fspan><\u002Fdiv>\n  <div data-screen-label=\"01 Welcome\" style=\"width:1440px;height:900px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;overflow:hidden\">\n    <div style=\"height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface)\">\n      <div style=\"display:flex;gap:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--line-2)\"><\u002Fspan><span style=\"width:12px;height:12px;border-radius:50%;background:var(--line-2)\"><\u002Fspan><span style=\"width:12px;height:12px;border-radius:50%;background:var(--line-2)\"><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-left:8px\"><div style=\"width:12px;height:12px;background:var(--accent);border-radius:4px\"><\u002Fdiv><span style=\"font-size:13px;font-weight:800\">RustBase<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button style=\"font-size:12px;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink-2)\">Settings<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0\">\n      <div style=\"padding:28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow:hidden\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3)\">Workspace<\u002Fdiv>\n            <div style=\"font-size:28px;font-weight:800;letter-spacing:-0.034em\">Connections<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <button style=\"font-size:13px;font-weight:700;padding:9px 15px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink-2)\">New folder<\u002Fbutton>\n            <button style=\"font-size:13px;font-weight:700;padding:9px 15px;border:none;border-radius:4px;background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 var(--accent-shadow)\">New connection<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center\">\n          <div style=\"flex:1;max-width:420px;height:38px;border:1px solid var(--border-control);border-radius:4px;background:var(--surface);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--ink-3)\">Search connections<\u002Fdiv>\n          <div role=\"radiogroup\" style=\"display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;font-size:12px;font-weight:700\">\n            <span style=\"padding:8px 12px;background:var(--accent-tint);color:var(--accent-on-tint)\">All<\u002Fspan>\n            <span style=\"padding:8px 12px;color:var(--ink-2);border-left:1px solid var(--line)\">Favorites<\u002Fspan>\n            <span style=\"padding:8px 12px;color:var(--ink-2);border-left:1px solid var(--line)\">Recent<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ folders }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <div style=\"border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)\">\n                <span style=\"font-size:10px;color:var(--ink-3)\">▾<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:600\">{{ f.name }}<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums\">{{ f.count }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ f.items }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:20px 28px minmax(0,1.2fr) 130px minmax(0,1.6fr) 120px 110px;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line-2);cursor:pointer\" style-hover=\"background:var(--sunk)\">\n                  <span style=\"font-size:13px;color:var(--accent-text)\">{{ c.star }}<\u002Fspan>\n                  <span title=\"{{ c.engine }}\" style=\"width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#15171A;background:{{ c.mgBg }}\">{{ c.mg }}<\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:600\">{{ c.name }}<\u002Fspan>\n                  <span style=\"justify-self:start;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:{{ c.envBg }};color:{{ c.envInk }};border:1px solid {{ c.envBorder }}\">{{ c.env }}<\u002Fspan>\n                  <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.addr }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:var(--ink-3)\">{{ c.last }}<\u002Fspan>\n                  <span style=\"justify-self:end;font-size:12px;font-weight:700;color:var(--ink-2)\">Connect →<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside style=\"border-left:1px solid var(--line);background:var(--surface);padding:40px 24px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3)\">Recent queries<\u002Fdiv>\n        <sc-for list=\"{{ recentQueries }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line-2)\">\n            <div style=\"font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical\">{{ q.sql }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--ink-3)\">{{ q.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-size:12px;line-height:1.5;color:var(--ink-3)\">Opening a recent query places it in a new tab. Nothing runs until you press Run.<\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 02a ENGINE PICKER -->\n<div id=\"s02a\" style=\"display:flex;flex-direction:column;gap:12px\">\n  <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:4px\">02a<\u002Fspan><span style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em\">Choose a database engine<\u002Fspan><span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)\">All engines<\u002Fspan><\u002Fdiv>\n  <div data-screen-label=\"02a Engine picker\" style=\"width:1440px;height:900px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;overflow:hidden\">\n    <div style=\"height:40px;flex:none;display:flex;align-items ">Page 1 · 100 rows · paging state held in memory, not stored<\u002Fspan>\n          <button style=\"font-size:12px;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink-2)\">Next page<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fdiv>\n    <div style=\"height:24px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2)\"><span style=\"display:flex;align-items:center;gap:6px;color:var(--positive);font-weight:600\"><span style=\"width:6px;height:6px;background:currentColor\"><\u002Fspan>Connected<\u002Fspan><span>Cassandra 5.0<\u002Fspan><span>Coordinator 10.0.4.12<\u002Fspan><div style=\"flex:1\"><\u002Fdiv><span>100 rows · 6 ms<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 15 CAPABILITIES -->\n<div id=\"s15\" style=\"display:flex;flex-direction:column;gap:12px\">\n  <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:4px\">15<\u002Fspan><span style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em\">Engine capabilities and roadmap<\u002Fspan><span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)\">Settings · Engines<\u002Fspan><\u002Fdiv>\n  <div data-screen-label=\"15 Capabilities\" style=\"width:1440px;height:900px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;overflow:hidden\">\n    <div style=\"height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface)\">\n      <div style=\"display:flex;gap:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--line-2)\">
